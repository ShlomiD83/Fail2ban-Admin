      <rect x="488" y="440" width="142" height="48" rx="10" fill="#10282a" stroke="#1f5a55"/>
      <text x="559" y="471" fill="#7eead9" text-anchor="middle">Backups</text>
      <rect x="646" y="440" width="150" height="48" rx="10" fill="#10282a" stroke="#1f5a55"/>
      <text x="721" y="471" fill="#7eead9" text-anchor="middle">Passkeys</text>
