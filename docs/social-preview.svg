<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#0f766e" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0b1517" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="bars" width="44" height="640" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="640" fill="#ffffff" opacity=".028"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#0b1517"/>
  <rect width="1280" height="640" fill="url(#bars)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- big emblem on the right -->
  <g transform="translate(840 120)">
    <rect x="0" y="0" width="360" height="360" rx="84" fill="#0f2a2e" stroke="#1d4146" stroke-width="2"/>
