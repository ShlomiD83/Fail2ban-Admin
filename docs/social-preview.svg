    <g stroke="#0f2a2e" stroke-width="19" stroke-linecap="round">
      <path d="M141 118v124M180 107v146M219 118v124"/>
    </g>
    <path d="M115 158h130" stroke="#0f2a2e" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- text -->
