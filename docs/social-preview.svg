    <text x="88" y="200" fill="#5eead4" font-size="26" font-weight="700" letter-spacing="5">SELF-HOSTED · DOCKER</text>
    <text x="84" y="290" fill="#ecf6f4" font-size="96" font-weight="800" letter-spacing="-2">Fail2ban Admin</text>
    <text x="88" y="350" fill="#a9c2bf" font-size="31" font-weight="500">A web panel for Fail2ban: jails, filters, actions,</text>
    <text x="88" y="392" fill="#a9c2bf" font-size="31" font-weight="500">bans and unbans, from your browser.</text>
    <g font-size="22" font-weight="600">
      <rect x="88" y="440" width="196" height="48" rx="10" fill="#10282a" stroke="#1f5a55"/>
      <text x="186" y="471" fill="#7eead9" text-anchor="middle">Validated editor</text>
      <rect x="300" y="440" width="172" height="48" rx="10" fill="#10282a" stroke="#1f5a55"/>
