# Weekly pull requests for outdated or vulnerable dependencies. Each one gets a test build and smoke test,
# and a comment mentioning the repository owner with the result (see workflows/dependabot-check.yml).
# Nothing is merged automatically: you review and merge each update yourself.
#
# Dependabot alerts and security updates are also switched on in the repository settings (Settings →
# Code security): a package with a known vulnerability gets a pull request as soon as the advisory is
# published, without waiting for Monday, and gets the same test and notification.
# The image itself (base images, Fail2ban, system packages) is scanned weekly by workflows/cve-check.yml.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # CodeMirror and esbuild for the configuration editor (bundled into the image)
  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*", "@replit/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
