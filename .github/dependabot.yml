# Weekly pull requests for outdated or vulnerable dependencies. Patch and minor updates are merged
# automatically after a test build (see workflows/dependabot-automerge.yml), and Python updates are
# then published as a new image. Major updates stay open for you to review.
#
# Dependabot alerts and security updates are also switched on in the repository settings (Settings →
# Code security): a package with a known vulnerability gets a pull request as soon as the advisory is
# published, without waiting for Monday, and goes through the same test-and-merge workflow.
# The image itself (base images, Fail2ban, system packages) is scanned weekly by workflows/cve-check.yml.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # CodeMirror and esbuild for the configuration editor (bundled into the image)
  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*", "@replit/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
